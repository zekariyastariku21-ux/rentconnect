<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password - RentConnect</title>
<link rel="stylesheet" href="css/auth.css">
</head><body class="authPage"><div class="authWrap">
<a class="authBack" href="login.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Back to login</a>
<div class="authCard">
  <div class="brand">
    <div class="brandMark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg></div>
    <span class="brandName">RentConnect</span>
  </div>

  <div id="step1">
    <h1>Forgot password?</h1>
    <p class="sub">Enter your phone number and we'll send you a code to reset it.</p>
    <form id="phoneForm">
      <div class="field"><label for="phone">Phone number</label>
        <input id="phone" type="tel" placeholder="09XXXXXXXX" autocomplete="tel" inputmode="tel" required></div>
      <button class="btnMain" type="submit">Send code</button>
    </form>
  </div>

  <div id="step2" style="display:none">
    <h1>Verify your phone</h1>
    <p class="sub">Enter the 6-digit code we sent to your phone.</p>
    <div id="otpSection">
      <div class="field"><label for="otp">Verification code</label>
        <input id="otp" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code"></div>
      <button id="verifyBtn" type="button" class="btnMain">Verify code</button>
      <button id="resendBtn" type="button" class="btnAlt">Resend code</button>
    </div>
  </div>

  <div id="step3" style="display:none">
    <h1>New password</h1>
    <p class="sub">Choose a new password for your account.</p>
    <form id="newPassForm">
      <div class="field"><label for="password">New password</label>
        <input id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" required></div>
      <div class="field"><label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" placeholder="Repeat your password" autocomplete="new-password" required></div>
      <button class="btnMain" type="submit">Save new password</button>
    </form>
  </div>

  <p id="msg"></p>
  <p class="switch">Remembered it? <a href="login.html">Log in</a></p>
</div></div>
<script src="js/forgot-password.js"></script>
<script src="js/password-toggle.js"></script>
</body></html>
